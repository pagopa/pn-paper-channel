components:
  headers:
    RequestId:
      description: Identificativo univoco della richiesta
      schema:
        type: string
  parameters:
    pathRecipientType:
      description: >-
        Enum per indicare se la ricerca è effettuata per una PF o per una PG
      name: recipient-type
      in: path
      required: true
      schema:
        type: string
        enum: [ PG , PF ]
  schemas:
    CorrelationId:
      type: string
      description: Identificativo univoco della richiesta
      minLength: 1
      maxLength: 255
      pattern: '^[A-Za-z0-9._:@#+=~-]+$'
    AddressRequestBody:
      type: object
      properties:
        filter:
          type: object
          required:
            - taxId
            - referenceRequestDate
            - correlationId
            - domicileType
          properties:
            taxId:
              x-field-extra-annotation: "@lombok.ToString.Exclude" # NO EXTERNAL
              type: string
              format: password # NO EXTERNAL
              example: AAAZZZ00H00T000Z
            referenceRequestDate:
              type: string
              format: date-time
            correlationId:
              $ref: '#/components/schemas/CorrelationId'
            domicileType:
              type: string
              enum: [ PHYSICAL , DIGITAL ]
    AddressOK:
      type: object
      properties:
        correlationId:
          $ref: '#/components/schemas/CorrelationId'
    CheckTaxIdRequestBody:
      type: object
      properties:
        filter:
          $ref: '#/components/schemas/TaxIdFilter'
    CheckTaxIdOK:
      type: object
      properties:
        taxId:
          x-field-extra-annotation: "@lombok.ToString.Exclude" # NO EXTERNAL
          type: string
          format: password # NO EXTERNAL
          example: AAAZZZ00H00T000Z
        isValid:
          type: boolean
          description: true se il codice fiscale/partita IVA risulta valido; false negli altri casi.
        errorCode:
          type: string
          enum: [B001_CHECK_TAX_ID_ERR01, B001_CHECK_TAX_ID_ERR02, B001_CHECK_TAX_ID_ERR03]
          description: >
            Error codes:
            
            
            _'B001_CHECK_TAX_ID_ERR01'_: CODICE FISCALE VALIDO NON UTILIZZABILE
            
            
            _'B001_CHECK_TAX_ID_ERR02'_: CODICE FISCALE NON VALIDO AGGIORNATO IN ALTRO
            
            
            _'B001_CHECK_TAX_ID_ERR03'_: CODICE FISCALE NON VALIDO
    CheckTaxIdError:
      type: object
      properties:
        status:
          type: integer
          description: Contiene il codice HTTP dell'errore
        title:
          type: string
        detail:
